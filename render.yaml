services:
  - type: web
    name: upi-offline-mesh
    runtime: docker
    plan: free
    branch: main

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      - key: MYSQL_HOST
        fromDatabase:
          name: upimesh-db
          property: host
      - key: MYSQL_PORT
        fromDatabase:
          name: upimesh-db
          property: port
      - key: MYSQL_DB
        fromDatabase:
          name: upimesh-db
          property: database
      - key: MYSQL_USER
        fromDatabase:
          name: upimesh-db
          property: user
      - key: MYSQL_PASSWORD
        fromDatabase:
          name: upimesh-db
          property: password
      - key: UPI_DATA_DIR
        value: /tmp/upi-data

databases:
  - name: upimesh-db
    plan: free
    databaseName: upimesh
    user: upimesh
