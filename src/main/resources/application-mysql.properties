# Activate with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Start MySQL first:  docker compose up -d     (see docker-compose.yml)
#
# Every value can be overridden with an environment variable.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:upimesh}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:upimesh}
spring.datasource.password=${MYSQL_PASSWORD:upimesh}

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Keep data between restarts: create missing tables, never drop them
spring.jpa.hibernate.ddl-auto=update

# The H2 console makes no sense against MySQL
spring.h2.console.enabled=false
